[workspace]
members = ["crates/cube-core", "crates/cube-cli", "bindings/python"]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/cubearc/cube"

[workspace.dependencies]
cube-core = { path = "crates/cube-core", version = "0.6.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
