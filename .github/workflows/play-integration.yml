name: Cube Play native integration

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "vendor/**"
      - "bindings/python/Cargo.toml"
      - "bindings/javascript/wasm/**"
      - ".github/workflows/play-integration.yml"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "vendor/**"
      - "bindings/python/Cargo.toml"
      - "bindings/javascript/wasm/**"
      - ".github/workflows/play-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  play-native:
    name: Native worker and typed graph (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      RUST_TEST_THREADS: "1"
    defaults:
      run:
        working-directory: play
    steps:
      - name: Check out the Core revision under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: cube
          persist-credentials: false
      - name: Check out the reviewed Play integration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cubearc/play
          ref: 964e08cb89c98cdccb3669a760d2f90c834fe6c1
          path: play
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Build the real Core CLI used by the native workbench
        run: cargo build --locked --manifest-path ../cube/Cargo.toml -p cube-cli
      - name: Test native execution, admission and evidence with the current Core
        run: cargo test --workspace --all-features --locked
      - name: Verify the complete Core contracts and real conformance fixtures
        run: cargo test --locked --manifest-path ../cube/Cargo.toml -p cube-core --test conformance_matrix --test operation_contracts --test execution_registry
