[package]
name = "cube-cli"
description = "CLI for data transformations, ciphers, file/media and offline web forensics, pipelines, recipes, and local investigations"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cube"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
cube-core.workspace = true
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
zeroize = "1.9"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["termios"] }

[lints]
workspace = true
