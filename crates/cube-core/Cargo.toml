[package]
name = "cube-core"
description = "Reusable Rust data transformations, ciphers, file/media and offline web forensics, pipelines, recipes, and local investigations"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
frodo-kem = { version = "=0.1.0", default-features = false, features = ["frodo640shake"] }
hqc-kem = { version = "=0.1.0-rc.0", default-features = false, features = ["dcap"] }
pq-mceliece = { version = "=0.3.0", default-features = false, features = ["mceliece460896f", "decapsulate"] }
oqs-native-bike = { version = "=0.16.0", default-features = false }
oqs-native-ntru = { version = "=0.16.0", default-features = false }
oqs-native-domain = { version = "=0.16.0", default-features = false }
libcrux-ml-kem = { path = "../../vendor/libcrux-ml-kem", version = "=0.0.11", default-features = false, features = ["mlkem512", "mlkem768", "mlkem1024", "kyber"] }
rsa = { version = "=0.10.0", default-features = false, features = ["std", "encoding", "pkcs1v15"] }
sm2 = { version = "=0.14.0", default-features = false, features = ["std", "pke", "pkcs8"] }
sm3 = { version = "=0.5.0", default-features = false, features = ["zeroize"] }
hmac = { version = "=0.13.0", default-features = false, features = ["zeroize"] }
crypto-primes = { version = "=0.7.2", default-features = false, features = ["alloc"] }
num-integer = { version = "=0.1.47", default-features = false }
crypto-bigint = { version = "=0.7.11", default-features = false, features = ["alloc", "zeroize"] }
rand_core = "=0.10.1"
getrandom02 = { package = "getrandom", version = "=0.2.17", features = ["std"] }
p256 = { version = "=0.14.0", default-features = false, features = ["arithmetic", "ecdh", "pkcs8"] }
x25519-dalek = { version = "=2.0.1", default-features = false, features = ["static_secrets", "zeroize"] }
age = { version = "=0.12.1", default-features = false }
pbkdf2 = { version = "=0.13.0", default-features = false, features = ["hmac"] }
aes-kw = { version = "=0.3.1", default-features = false, features = ["zeroize"] }
cts = "=0.7.0"
xts-mode = "=0.6.0"
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "zeroize"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
aes-siv = { version = "=0.8.0", default-features = false }
aes-gcm-siv = { version = "=0.12.1", default-features = false, features = ["aes"] }
ascon-aead = { version = "=0.6.0", features = ["zeroize"] }
ccm = { version = "=0.6.1", default-features = false }
eax = { version = "=0.5.0", default-features = false }
aes08 = { package = "aes", version = "=0.8.4", features = ["zeroize"] }
ocb3 = { version = "=0.2.0", default-features = false }
aegis = { version = "=0.9.20", default-features = false, features = ["std", "pure-rust", "rustcrypto-traits-06"] }
deoxys = { version = "=0.2.1", default-features = false }
cbc = { version = "=0.2.1", features = ["zeroize"] }
ecb = { version = "=0.2.1", features = ["zeroize"] }
cfb-mode = { version = "=0.9.1", features = ["zeroize"] }
ofb = { version = "=0.7.1", features = ["zeroize"] }
ctr = { version = "=0.10.1", features = ["zeroize"] }
rc4 = { version = "=0.2.0", features = ["zeroize"] }
hc-256 = { version = "=0.6.0", features = ["zeroize"] }
rabbit = { version = "=0.5.0", features = ["zeroize"] }
aria={ version="=0.2.0", features=["zeroize"] }
camellia={ version="=0.2.1", features=["zeroize"] }
cast5={ version="=0.12.0", features=["zeroize"] }
cast6={ version="=0.2.0", features=["zeroize"] }
gift-cipher={ version="=0.1.0", features=["zeroize"] }
kuznyechik={ version="=0.9.0", features=["zeroize"] }
magma={ version="=0.10.0", features=["zeroize"] }
rc5={ version="=0.1.0", features=["zeroize"] }
rc6={ version="=0.1.0", features=["zeroize"] }
serpent={ version="=0.6.0", features=["zeroize"] }
sm4={ version="=0.6.0", features=["zeroize"] }
speck-cipher={ version="=0.1.0", features=["zeroize"] }
twofish={ version="=0.8.0", features=["zeroize"] }
xtea={ version="=0.1.0", features=["zeroize"] }
aes = { version = "=0.9.3", features = ["zeroize"] }
des = { version = "=0.9.0", features = ["zeroize"] }
blowfish = { version = "=0.10.0", features = ["zeroize"] }
idea = { version = "=0.6.0", features = ["zeroize"] }
rc2 = { version = "=0.9.0", features = ["zeroize"] }
zeroize = "1.9"
base64 = "0.23"
bs58 = "0.5"
crc32fast = "1.5"
crc = "3.4"
data-encoding = "2.11"
hex = "0.4"
html5gum = { version = "0.8.4", default-features = false }
kamadak-exif = "0.6"
lofty = "0.25.4"
md-5 = "0.11"
png = "0.18"
quircs = "0.10.3"
rustfft = { version = "6.4.1", default-features = false }
raster-codecs = { package = "image", version = "0.25.10", default-features = false, features = ["jpeg", "gif", "bmp", "webp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = { version = "0.11", features = ["zeroize"] }
sha1 = "0.11"
unicode-normalization = "=0.1.26"
unicode-general-category = "=1.1.0"
unicode-segmentation = "=1.13.3"
regex-automata = { version = "=0.4.18", default-features = false, features = ["std", "syntax", "unicode", "nfa-pikevm"] }
regex-syntax = "=0.8.11"
rphonetic = { version = "=4.0.0", default-features = false }
csv-core = "0.1.13"
num-bigint = { version = "0.5.1", default-features = false }
k256 = { version = "0.14.0", default-features = false, features = ["arithmetic"] }
sha3 = { version = "0.12.0", default-features = false }
ripemd = { version = "0.2.0", default-features = false }
schemars = "=1.2.3"
jsonschema = { version = "=0.60.2", default-features = false }
chacha20 = { version = "=0.10.2", features = ["xchacha", "zeroize"] }
salsa20 = { path = "../../vendor/salsa20", version = "=0.11.0", features = ["zeroize"] }
adler2 = { version = "=2.0.1", default-features = false }
blake2 = { version = "=0.11.0", default-features = false }
blake3 = { version = "=1.8.7", default-features = false, features = ["pure"] }
md4 = { version = "=0.11.0", default-features = false }
whirlpool = { version = "=0.11.0", default-features = false }

base91 = { version = "=0.1.0", default-features = false, features = ["canonical", "std"] }

web_atoms = { version = "=0.3.0", default-features = false }

argon2 = { version = "=0.6.0", default-features = false, features = ["zeroize"] }
scrypt = { version = "=0.11.0", default-features = false }
hkdf = { version = "=0.13.0", default-features = false }

flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
brotli = { version = "=9.1.3", default-features = false, features = ["std", "disallow_large_window_size"] }
ruzstd = { version = "=0.9.1", default-features = false, features = ["std", "hash"] }
lzma-rust2 = { version = "=0.25.0", default-features = false, features = ["std", "encoder"] }

jpxl-jpeg = "=0.3.0"

[lints]
workspace = true

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
