[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "cubearc-cube"
dynamic = ["version"]
description = "Rust-backed encoding, classical ciphers, hashing, binary tools, and file forensics"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]

[project.urls]
Repository = "https://github.com/cubearc/cube"
Issues = "https://github.com/cubearc/cube/issues"

[dependency-groups]
dev = ["maturin>=1.9.4,<2", "pytest>=8,<10", "ruff>=0.14,<1"]

[tool.maturin]
manifest-path = "bindings/python/Cargo.toml"
python-source = "bindings/python/python"
module-name = "cube._native"
# Keep workspace members together so the shared Cargo.lock remains valid in sdists.
sdist-generator = "git"

[tool.pytest.ini_options]
testpaths = ["bindings/python/tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
