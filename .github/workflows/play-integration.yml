name: Cube Play native integration

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "vendor/**"
      - "bindings/python/Cargo.toml"
      - "bindings/javascript/wasm/**"
      - ".github/workflows/play-integration.yml"
      - ".github/scripts/adopt_core_lock.py"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/**"
      - "vendor/**"
      - "bindings/python/Cargo.toml"
      - "bindings/javascript/wasm/**"
      - ".github/workflows/play-integration.yml"
      - ".github/scripts/adopt_core_lock.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  play-native:
    name: Native worker and typed graph (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Match Play's full serial workspace suite budget on Windows runners.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 45 }}
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      RUST_TEST_THREADS: "1"
    defaults:
      run:
        working-directory: play
    steps:
      - name: Check out the Core revision under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: cube
          persist-credentials: false
      - name: Check out the reviewed Play integration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cubearc/play
          ref: 7c68d0e167de3ee3aff41e9a4e4e93d4955b12f7
          path: play
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Build the real Core CLI used by the native workbench
        run: cargo build --locked --manifest-path ../cube/Cargo.toml -p cube-cli
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify the reviewed Play lock with the current Core dependency identities
        run: |
          cargo fetch --locked --manifest-path ../cube/Cargo.toml
          python ../cube/.github/scripts/adopt_core_lock.py . ../cube
      - name: Test native execution, admission and evidence with the current Core
        run: cargo test --workspace --all-features --locked
      - name: Verify the complete Core contracts and real conformance fixtures
        run: cargo test --locked --manifest-path ../cube/Cargo.toml -p cube-core --test conformance_matrix --test operation_contracts --test execution_registry
