[package]
name = "cube-core"
description = "Byte-oriented encoding, classical ciphers, hashing, binary transformations, file forensics, and image analysis"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.23"
bs58 = "0.5"
crc32fast = "1.5"
data-encoding = "2.11"
hex = "0.4"
kamadak-exif = "0.6"
png = "0.18"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11"
unicode-normalization = "=0.1.26"

[lints]
workspace = true
