[package]
name = "cube-core"
description = "Byte-oriented encoding, classical ciphers, hashing, binary transformations, file/image forensics, Unicode text, symbols, bounded audio analysis/FLAC metadata, typed pipelines/recipes, and local investigation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.23"
bs58 = "0.5"
crc32fast = "1.5"
crc = "3.4"
data-encoding = "2.11"
hex = "0.4"
kamadak-exif = "0.6"
lofty = "0.25.4"
md-5 = "0.11"
png = "0.18"
quircs = "0.10.3"
rustfft = { version = "6.4.1", default-features = false }
raster-codecs = { package = "image", version = "0.25.10", default-features = false, features = ["jpeg", "gif", "bmp", "webp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
sha1 = "0.11"
unicode-normalization = "=0.1.26"

[lints]
workspace = true
