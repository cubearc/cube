name: Bug report
description: Report incorrect behavior in the core, CLI, or Python SDK.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For vulnerabilities, use the private reporting instructions in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include the operating system and Rust or Python version.
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest command or code sample and input that reproduces the problem. Remove sensitive data.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include error output when available.
    validations:
      required: true
